source = ~/.config/hypr/profiles/current/hyprlock.conf

general {
    hide_cursor = true
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgb(1e1e2e)

    outer_color = rgb(cba6f7)
    check_color = rgb(313244)
    fail_color = rgb(f38ba8)

    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 0

    position = 0, -20
    halign = center
    valign = center
}

shape {
    monitor =
    size = 360, 60
    color = rgb(1e1e2e)
    rounding = 0
    border_size = 1
    border_color = rgb(313244)

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgb(cdd6f4)
    font_size = 25
    font_family = Hack Nerd Font

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = rgb(cdd6f4)
    font_size = 55
    font_family = Hack Nerd Font
    position = -100, 40
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
