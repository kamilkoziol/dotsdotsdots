set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g status-style "bg=default,fg=#6c7086"
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 100
set -g status-justify left

set -g window-status-separator "   "
set -g window-status-format "#[fg=#45475a]#I #[fg=#6c7086]#W"
set -g window-status-current-format "#[fg=#cba6f7]#I #[fg=#bac2de]#W"
set -g window-status-activity-style "fg=#f9e2af"
set -g window-status-bell-style "fg=#f38ba8"

set -g status-right "#[fg=#6c7086]#{b:pane_current_path}   #[fg=#6c7086]#S"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines single

set -g message-style "bg=#181825,fg=#cdd6f4"
set -g message-command-style "bg=#181825,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g copy-mode-match-style "bg=#313244,fg=#cdd6f4"
set -g copy-mode-current-match-style "bg=#cba6f7,fg=#1e1e2e"

set -g clock-mode-colour "#cba6f7"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
